# Local stack. Credentials are local-only defaults; Postgres is not published to the host.
x-py: &py
  image: indicium-py
  environment:
    INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: indicium
      POSTGRES_PASSWORD: indicium
      POSTGRES_DB: indicium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicium -d indicium"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs migrations and loads the shipped policies, then exits; the API waits for it.
  migrate:
    <<: *py
    build: .
    # Loading is idempotent: an unchanged policy file is not stored again.
    command: sh -c "alembic upgrade head && python -m indicium.policies load data/policies --publish"

  # Demo only: loads the synthetic labelled cases so there is work to review. Not for production.
  demo-data:
    <<: *py
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m indicium.cases load data/cases

  # Reviews queued cases. Scale with: docker compose up --scale worker=3
  worker:
    <<: *py
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m indicium.review.worker
    environment:
      INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
      INDICIUM_PROVIDER: ${INDICIUM_PROVIDER:-baseline}
      INDICIUM_OPENAI_BASE_URL: ${INDICIUM_OPENAI_BASE_URL:-}
      INDICIUM_OPENAI_MODEL: ${INDICIUM_OPENAI_MODEL:-}
      INDICIUM_OPENAI_API_KEY: ${INDICIUM_OPENAI_API_KEY:-}
      INDICIUM_PROMPT_VERSION: ${INDICIUM_PROMPT_VERSION:-extract-v1}
    extra_hosts: ["host.docker.internal:host-gateway"] # reach a model server on the host
    stop_grace_period: 2m # let a running review finish
    restart: unless-stopped

  api:
    <<: *py
    depends_on:
      migrate:
        condition: service_completed_successfully
    # shortcut: the API is published directly for local development; in Phase 7 the Caddy proxy
    # becomes the only entry point and this port mapping goes away.
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
