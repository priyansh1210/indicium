# Local stack. Credentials are local-only defaults; Postgres is not published to the host.
x-py: &py
  image: indicium-py
  environment:
    INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: indicium
      POSTGRES_PASSWORD: indicium
      POSTGRES_DB: indicium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-start init Postgres runs a socket-only temporary server, and a
      # socket check would report ready before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U indicium -d indicium"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot setup the API and worker wait for: migrations, then the shipped policies, then (demo
  # only) the demo sign-ins and the synthetic labelled cases. Every step is idempotent. It is one
  # service on purpose: `docker compose up --wait` fails on a one-shot nothing depends on.
  migrate:
    <<: *py
    build: .
    environment:
      INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
      INDICIUM_DEMO_USERS: "true"
      INDICIUM_DEMO_DATA: "true" # never set outside a demo
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && python -m indicium.policies load data/policies --publish
        && if [ "$$INDICIUM_DEMO_DATA" = "true" ]; then
        python -m indicium.api.users seed-demo && python -m indicium.cases load data/cases; fi

  # Reviews queued cases. Scale with: docker compose up --scale worker=3
  worker:
    <<: *py
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python -m indicium.review.worker
    environment:
      INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
      INDICIUM_PROVIDER: ${INDICIUM_PROVIDER:-baseline}
      INDICIUM_OPENAI_BASE_URL: ${INDICIUM_OPENAI_BASE_URL:-}
      INDICIUM_OPENAI_MODEL: ${INDICIUM_OPENAI_MODEL:-}
      INDICIUM_OPENAI_API_KEY: ${INDICIUM_OPENAI_API_KEY:-}
      INDICIUM_PROMPT_VERSION: ${INDICIUM_PROMPT_VERSION:-extract-v1}
      # The worker also sends the email outbox (invitations, password resets, decisions).
      INDICIUM_SMTP_URL: ${INDICIUM_SMTP_URL:-smtp://mailpit:1025}
    extra_hosts: ["host.docker.internal:host-gateway"] # reach a model server on the host
    stop_grace_period: 2m # let a running review finish
    restart: unless-stopped

  api:
    <<: *py
    environment:
      INDICIUM_DATABASE_URL: postgresql://indicium:indicium@postgres:5432/indicium
      INDICIUM_DEMO_USERS: "true" # offers the sample sign-ins on the sign-in page; demo only
      INDICIUM_PUBLIC_URL: ${INDICIUM_PUBLIC_URL:-http://localhost:8080} # links in emails
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Not published: only the proxy and the web app reach it. That is also why it may trust the
    # X-Forwarded-For header they send (FORWARDED_ALLOW_IPS), for the per-address sign-in limit.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The nurse and admin screens. The browser talks only to this service; it calls the API itself.
  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Catches the stack's email locally: read it at http://localhost:8025. Bound to this machine
  # only; a real deployment sets INDICIUM_SMTP_URL to its mail service instead.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  # The only published port for people.
  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "8080:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/login"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  caddy-data:
