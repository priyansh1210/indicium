name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json # the pnpm version is pinned there
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  # The whole stack from a clean start, then the browser tests against it, as people use it.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: docker compose exec -T api python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/ready').read())"
      # The proxy is the only way in, and it does not publish operations endpoints.
      - run: curl -fsS http://localhost:8080/login | grep -q Indicium
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = 404
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/openapi.json)" = 404
      - name: Wait for the worker to review every demo case
        run: |
          for i in $(seq 1 60); do
            left=$(docker compose exec -T postgres psql -U indicium -Atc \
              "select count(*) from review.runs where status in ('queued','running')")
            [ "$left" = "0" ] && exit 0
            sleep 5
          done
          exit 1
      # The keyless baseline never approves on its own (a safety property, also unit-tested).
      - run: >
          docker compose exec -T postgres psql -U indicium -Atc
          "select count(*) from review.runs where recommendation = 'meets_criteria'" | grep -x 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test
        working-directory: web
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
