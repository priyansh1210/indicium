      text: |
        70M with left knee osteoarthritis. Standing films show complete loss of lateral joint space (bone-on-bone), osteophytes, and 18 degrees of fixed valgus deformity with lateral subluxation of the tibia.
        He cannot walk more than 50 feet and needs help with stairs; uses a walker.
        Given bone-on-bone articulation and severe fixed deformity, physical therapy and injections would be ineffective and risk further collapse; non-surgical management is not appropriate, and I discussed the risks of surgery with him.
        Plan: left TKA.
