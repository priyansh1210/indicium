      text: |
        77M with acute herpes zoster in the right T6 dermatome, rash onset 12 days ago. Completed 7 days of valacyclovir; on gabapentin 300 mg TID and lidocaine patches. Pain remains refractory to these conservative measures and keeps him from sleeping.
        Pain NRS 9/10 at baseline today; unable to dress or bathe without help.
        Plan: right T6-7 transforaminal epidural steroid injection with fluoroscopic guidance and contrast.
        He walks 20 minutes daily with his wife and will keep doing the home stretching program we gave him.
