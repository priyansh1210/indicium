      text: |
        Left buttock and lateral leg pain into the dorsum of the foot for 4 months, consistent with left L5 radiculopathy and concordant with the MRI findings at L4-5.
        Baseline scores today: NRS 8/10, Oswestry Disability Index 52%. Unable to walk more than one block or sit through a workday.
        Treatment so far: 8 weeks of physical therapy and gabapentin titrated to 900 mg/day, without adequate relief.
        Plan: left L4-5 transforaminal epidural steroid injection under fluoroscopic guidance with contrast. She will continue her daily home exercise program from PT. Will repeat NRS and ODI at follow-up.
