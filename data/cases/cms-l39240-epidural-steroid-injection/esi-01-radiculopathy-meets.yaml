      text: |
        MRI LUMBAR SPINE: At L4-5 there is moderate to severe left foraminal stenosis from a disc osteophyte complex contacting the exiting left L4 and traversing L5 nerve roots.
    - doc_id: pain-consult
      kind: progress_note
      author: M. Delacroix, MD (pain medicine)
