        ANNUAL WELLNESS VISIT AND PROBLEM-FOCUSED CARE
        1. Type 2 diabetes: A1c 7.4, up from 7.1. Continue metformin 1000 mg BID; add empagliflozin 10 mg daily. Foot exam normal, monofilament intact. Retinal exam due in January.
        2. Hypertension: 132/78 today on lisinopril 20 mg. Continue. BMP in 3 months.
        3. Hyperlipidemia: LDL 96 on atorvastatin 40 mg. Discussed diet. No change.
        4. Health maintenance: Mammogram up to date. Colonoscopy 2022 normal, next 2032. Influenza vaccine given today. Shingles vaccine series complete. Discussed fall prevention.
        5. Hypothyroidism: TSH 2.1 on levothyroxine 75 mcg. Continue.
        6. Back and leg pain: Right buttock and calf pain with numbness on the lateral foot for 3 months. MRI 10/28/2026 shows a right L5-S1 disc extrusion compressing the right S1 nerve root, concordant with her absent right ankle reflex and S1 sensory loss. She did 6 weeks of PT and a trial of gabapentin and meloxicam with no improvement. Today NRS 7/10 and Oswestry 46%, cannot stand to cook a meal. Referring for a right L5-S1 transforaminal epidural steroid injection under fluoroscopy with contrast; she will continue the home exercise program from PT.
        7. GERD: well controlled on omeprazole 20 mg. Attempt step-down in spring.
        8. Mood: PHQ-9 of 4. No changes.
        9. Osteopenia: DEXA T-score -1.6. Calcium and vitamin D. Repeat in 2 years.
        10. Seasonal allergies: loratadine as needed.
        Medication reconciliation completed. Return in 3 months or sooner if needed.
