        CC: low back pain with radiation to the left buttock and thigh.
        HPI: 58 y/o F, symptoms since early September after moving furniture. She completed six weeks of formal physical therapy (11 visits) and has taken naproxen 500 mg twice daily throughout, with no meaningful improvement. Oswestry 44% today, unchanged from intake.
        ROS: Denies fever, chills, weight loss, bowel or bladder changes. No history of cancer. No recent infections.
        Exam: Lumbar paraspinal tenderness. Strength 5/5 bilateral lower extremities, reflexes 2+ and symmetric, sensation intact, straight leg raise negative bilaterally.
        A/P: Lumbar disc displacement with persistent radiating pain after a full conservative trial. MRI lumbar spine without contrast. If MRI shows a disc lesion at L4-5 or L5-S1, plan referral for an epidural steroid injection; otherwise continue home program.
